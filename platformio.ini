; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n8r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
extra_scripts = pre:tools/pio_python_path.py
board_build.flash_size = 8MB
board_erase_flash = true
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
build_unflags = 
	-D ARDUINO_USB_MODE
	-std=gnu++11
build_flags = 
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-std=gnu++17
	-Wno-cpp
board_build.usb_cdc_on_boot = enable
monitor_speed = 921600
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
	adafruit/Adafruit NeoPixel@1.15.5
	ftservo/FTServo@2.0.0
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@2.5.17
	olikraus/U8g2@2.36.18
	vortigont/ESPAsyncButton@1.2.2
	bolderflight/Bolder Flight Systems SBUS@8.1.4
	ESP32Async/AsyncTCP@3.5.0
	ESP32Async/ESPAsyncWebServer@3.12.1
	handmade0octopus/ESP32-TWAI-CAN@1.0.1

	adafruit/Adafruit BusIO@1.17.4
